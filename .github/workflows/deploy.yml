name: Deploy

# Zero-touch production deploys to https://agents-anonymous.pages.dev on every push to main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Pages + D1 edit) and CLOUDFLARE_ACCOUNT_ID.
# Optional: AA_HASH_SALT (salt for IP and token hashes; set once and keep it stable).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT: agents-anonymous
  DB_NAME: agents-anonymous

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'KarthikSubramanian07/Agents-Anonymous'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AA_HASH_SALT: ${{ secrets.AA_HASH_SALT }}
    steps:
      - name: Skip until Cloudflare secrets are configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable deploys."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: dtolnay/rust-toolchain@stable
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: oven-sh/setup-bun@v2
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 24

      - name: Build engine and site
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run wasm
          bun test
          bun run build

      - name: Ensure D1 database exists and wire its id
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: web
        run: |
          id=$(bunx wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          if [ -z "$id" ]; then
            bunx wrangler d1 create "$DB_NAME"
            id=$(bunx wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          fi
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          bunx wrangler d1 migrations apply "$DB_NAME" --remote

      - name: Ensure Pages project exists
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: web
        run: |
          bunx wrangler pages project list --json | jq -e --arg n "$PROJECT" 'any(.[]; .["Project Name"] == $n or .name == $n)' >/dev/null \
            || bunx wrangler pages project create "$PROJECT" --production-branch main

      - name: Set hash salt
        if: env.CLOUDFLARE_API_TOKEN != '' && env.AA_HASH_SALT != ''
        working-directory: web
        run: printf '%s' "$AA_HASH_SALT" | bunx wrangler pages secret put HASH_SALT --project-name "$PROJECT"

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: web
        run: bunx wrangler pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true

      - name: Smoke test
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 20
          base=https://$PROJECT.pages.dev
          curl -fsS "$base/" -o /dev/null
          curl -fsS "$base/api/v1/stats" | jq -e '.shares >= 0'
          curl -fsS "$base/mcp" -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' | jq -e '.result.serverInfo.name'
