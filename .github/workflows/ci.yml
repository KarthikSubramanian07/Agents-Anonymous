name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clinician:
    name: Clinician (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test -p clinician
      - run: cargo clippy -p clinician -- -D warnings
      - name: Accuracy report
        run: |
          cargo run -q -p clinician --bin aa-eval -- evals/corpus /tmp/dev.json
          cargo run -q -p clinician --bin aa-eval -- evals/heldout-v2 /tmp/heldout.json
      - name: Build wasm
        run: |
          cargo build --release -p clinician --lib --target wasm32-unknown-unknown
          ls -la target/wasm32-unknown-unknown/release/clinician.wasm

  web:
    name: Website (Astro + Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run wasm
        working-directory: web
      - run: bun test
        working-directory: web
      - run: bun run build
        working-directory: web
