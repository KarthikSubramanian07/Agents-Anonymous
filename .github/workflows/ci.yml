name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clinician:
    name: Clinician (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p clinician
      - run: cargo clippy -p clinician -- -D warnings
      - name: Accuracy report
        run: |
          cargo run -q -p clinician --bin aa-eval -- evals/corpus /tmp/dev.json
          cargo run -q -p clinician --bin aa-eval -- evals/heldout /tmp/heldout.json
      - name: Build wasm
        run: |
          cargo build --release -p clinician --lib --target wasm32-unknown-unknown
          ls -la target/wasm32-unknown-unknown/release/clinician.wasm
