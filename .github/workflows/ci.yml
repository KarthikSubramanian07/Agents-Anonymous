name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clinician:
    name: Clinician (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p clinician
      - run: cargo clippy -p clinician -- -D warnings
      - name: Accuracy report
        run: |
          cargo run -q -p clinician --bin aa-eval -- evals/corpus /tmp/dev.json
          cargo run -q -p clinician --bin aa-eval -- evals/heldout-v2 /tmp/heldout.json
      - name: Build wasm
        run: |
          cargo build --release -p clinician --lib --target wasm32-unknown-unknown
          ls -la target/wasm32-unknown-unknown/release/clinician.wasm

  web:
    name: Website (Astro + Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run wasm
        working-directory: web
      - run: bun test
        working-directory: web
      - run: bun run build
        working-directory: web
