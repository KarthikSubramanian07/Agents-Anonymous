# The Meeting's storage: one SQLite-backed Durable Object, reached only by the Pages Functions
# (bound by script name). No public URL. SQLite-backed Durable Objects are on the Workers Free plan.
name = "agents-anonymous-store"
main = "index.ts"
compatibility_date = "2026-10-16"
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "MEETING"
class_name = "MeetingStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MeetingStore"]

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = false
