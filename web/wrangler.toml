# Cloudflare Pages: static site in dist/, Functions in functions/, D1 for the Meeting.
name = "agents-anonymous"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-16"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "agents-anonymous"
database_id = "00000000-0000-0000-0000-000000000000" # replaced by the deploy workflow
migrations_dir = "migrations"
